<section x-show="tab==='url'">
  <div class="card">
    <div class="card-title">
      视频链接
      <button class="btn btn-sm" @click="urlBatchMode=!urlBatchMode"
              x-text="urlBatchMode?'单链接':'批量'"
              :style="urlBatchMode?'background:var(--primary);color:#fff;border-color:var(--primary)':''" style="margin-left:auto"></button>
    </div>
    <label class="label" for="url-text" x-show="!urlBatchMode">粘贴链接</label>
    <input type="text" id="url-text" x-model="urlText" x-show="!urlBatchMode"
           placeholder="粘贴抖音、B站、YouTube 链接..." autocomplete="off" @paste="onPaste">
    <label class="label" for="url-batch" x-show="urlBatchMode">多个链接（每行一个）</label>
    <textarea id="url-batch" x-model="urlBatchText" x-show="urlBatchMode"
              placeholder="每行一个链接..." rows="4" style="width:100%;background:var(--input);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--white);font-size:13px;outline:none;font-family:inherit;resize:vertical"></textarea>
    <div class="hint" x-show="!urlBatchMode">支持抖音 · B站 · YouTube · Ctrl+Enter 开始</div>
    <div class="hint" x-show="urlBatchMode">每行一个链接，自动去重</div>
    <label class="playlist-toggle">
      <input type="checkbox" x-model="usePlaylist">
      <span>下载整个播放列表/合集</span>
    </label>
    <label class="playlist-toggle">
      <input type="checkbox" x-model="useSubs">
      <span>同时下载字幕 (SRT)</span>
    </label>
    <label class="playlist-toggle">
      <input type="checkbox" x-model="loudnorm">
      <span>音量归一化 (EBU R128)</span>
    </label>
    <label class="playlist-toggle">
      <input type="checkbox" x-model="videoMode">
      <span>下载完整视频</span>
    </label>
  </div>
  <div class="card">
    <div class="card-title">输出设置</div>
    <div class="settings-grid">
      <div class="field"><label class="label" for="url-fmt">格式</label><select id="url-fmt" x-model="urlFmt" @change="savePrefs"><option>mp3</option><option>wav</option><option>aac</option><option>m4a</option><option>m4r</option><option>ogg</option><option>flac</option></select></div>
      <div class="field"><label class="label" for="url-qual">音质</label><select id="url-qual" x-model="urlQual" @change="savePrefs"><option value="low">低 (128k)</option><option value="medium">中 (192k)</option><option value="high">高 (320k)</option></select></div>
    </div>
    <label class="label" for="url-dir" style="margin-top:14px">保存目录</label>
    <div class="row grow"><input type="text" id="url-dir" x-model="urlDir" placeholder="下载目录" autocomplete="off"><button class="btn" @click="selectDir">浏览</button></div>
  </div>
</section>
