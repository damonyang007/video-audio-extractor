<section x-show="tab==='local'">
  <div class="card">
    <div class="card-title">视频文件</div>
    <div>
      <div class="drop-zone" style="padding:16px"
           @click="addBatchFile" @dragover.prevent="dragOver=true"
           @dragleave="dragOver=false" @drop.prevent="handleBatchDrop">
        <div>点击或拖拽文件添加到列表（支持多选）</div>
      </div>
      <div class="batch-list" x-show="batchFiles.length>0">
        <template x-for="(f,i) in batchFiles" :key="i">
          <div class="batch-item" @click="previewFile=f">
            <span class="name" x-text="f.split('\\\\').pop()"></span>
            <span class="del" @click.stop="batchFiles.splice(i,1);if(previewFile===f)previewFile=batchFiles[0]||''">&times;</span>
          </div>
        </template>
      </div>
      <div x-show="batchFiles.length>0" style="margin-top:8px">
        <span style="font-size:12px;color:var(--sub)"
              x-text="batchFiles.length===1?'1 个文件':batchFiles.length+' 个文件'"></span>
        <button class="btn btn-sm btn-danger" style="float:right" @click="batchFiles=[];previewFile='';localOut='';tStart='';tEnd=''">清空</button>
      </div>

      <!-- Trim player: show when files exist -->
      <div x-show="batchFiles.length>0" style="margin-top:14px">
        <div class="card" style="background:var(--input);padding:12px;border-radius:10px">
          <div class="card-title" style="margin-bottom:8px;font-size:13px;display:flex;justify-content:space-between">
            视频预览
            <span style="font-weight:400;font-size:11px;color:var(--dim)" x-text="previewFile ? previewFile.split('\\\\').pop() : '点击列表中的文件预览'"></span>
          </div>
          <video :src="previewFile?'/api/video?path='+encodeURIComponent(previewFile):''" style="width:100%;border-radius:8px;max-height:160px;background:#000"
                 controls id="player" preload="metadata"></video>
          <div x-show="previewFile" style="text-align:center;margin-top:8px;font-size:12px;color:var(--sub)">
            <span x-show="!tStart && !tEnd">拖动进度条定位，点击下方按钮标记起止点</span>
            <span x-show="tStart||tEnd" style="font-weight:700;color:var(--white)">
              <span x-show="tStart" style="color:var(--success)" x-text="'选自 '+tStart"></span>
              <span x-show="tStart&&tEnd" style="color:var(--dim)"> — </span>
              <span x-show="tEnd" style="color:var(--primary)" x-text="'至 '+tEnd"></span>
            </span>
          </div>
          <div x-show="previewFile" class="row" style="margin-top:10px;gap:6px">
            <button class="btn btn-sm" @click="setStart" style="flex:1">设为起始</button>
            <button class="btn btn-sm" @click="setEnd" style="flex:1">设为结束</button>
            <button class="btn btn-sm" @click="resetTrim">重置</button>
            <button class="btn btn-sm" @click="previewTrim"
                    style="background:var(--accent);color:#fff;border-color:var(--accent)">预览</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">输出设置</div>
    <div class="settings-grid">
      <div class="field"><label class="label" for="local-fmt">格式</label><select id="local-fmt" x-model="localFmt" @change="savePrefs"><option>mp3</option><option>wav</option><option>aac</option><option>m4a</option><option>m4r</option><option>ogg</option><option>flac</option></select></div>
      <div class="field"><label class="label" for="local-qual">音质</label><select id="local-qual" x-model="localQual" @change="savePrefs"><option value="low">低 (128k)</option><option value="medium">中 (192k)</option><option value="high">高 (320k)</option></select></div>
    </div>
    <label class="label" for="local-out" style="margin-top:14px">保存至</label>
    <div class="row grow"><input type="text" id="local-out" x-model="localOut" placeholder="自动生成..." autocomplete="off"><button class="btn" @click="selectOutput">浏览</button></div>
    <div class="playlist-toggle"><input type="checkbox" x-model="loudnorm"><span>音量归一化 (EBU R128)</span></div>
    <div class="playlist-toggle"><input type="checkbox" x-model="videoMode"><span>下载完整视频 (非仅音频)</span></div>
    <div style="margin-top:10px;display:flex;gap:6px;align-items:center">
      <select @change="if($event.target.value)loadPreset($event.target.value)" style="flex:1;font-size:12px;padding:6px 10px">
        <option value="">预设 ...</option>
        <template x-for="p in presets" :key="p.name">
          <option :value="p.name" x-text="p.name + ' (' + p.fmt + '/' + p.qual + ')'"></option>
        </template>
      </select>
      <button class="btn btn-sm" @click="savePreset">+ 保存当前</button>
    </div>
  </div>
</section>
