<div class="card" x-show="history.length>0">
  <div class="card-title" style="margin-bottom:6px">
    最近提取
    <button class="btn btn-sm btn-danger" style="margin-left:auto" @click="clearHistory">清除</button>
  </div>
  <div class="history-card">
    <template x-for="(h,i) in history" :key="i">
      <div class="history-item" @click="openPath(h.output)" style="gap:6px">
        <span class="kind" x-text="h.kind==='url'?'URL':'FILE'"
              :style="h.kind==='url'?'background:var(--cyan)':''"></span>
        <span class="src" x-text="h.kind==='file' ? h.source.split('\\\\').pop() : h.source.slice(0,50)+(h.source.length>50?'...':'')"></span>
        <span class="time" x-text="h.time" style="margin-left:auto"></span>
        <span @click.stop="retryExtract(h)" style="cursor:pointer;color:var(--cyan);font-size:14px;padding:0 2px" title="重新提取">&#x21bb;</span>
        <span @click.stop="deleteHistoryItem(i)" style="cursor:pointer;color:var(--primary);font-size:14px;padding:0 2px" title="删除">&times;</span>
      </div>
    </template>
  </div>
</div>
