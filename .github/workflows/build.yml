name: Build and Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Run tests
        run: pytest tests/ -v

      - name: Build exe
        run: pyinstaller --onedir --noconsole --name AudioExtract --add-data "templates;templates" --add-data "static;static" app.py

      - name: Package
        run: |
          "@echo off`nstart `"`" `"%~dp0AudioExtract\AudioExtract.exe`"" | Out-File -FilePath dist\AudioExtract.bat -Encoding ASCII
          Compress-Archive -Path dist\AudioExtract, dist\AudioExtract.bat -DestinationPath AudioExtract.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioExtract
          path: AudioExtract.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AudioExtract.zip
          generate_release_notes: true
